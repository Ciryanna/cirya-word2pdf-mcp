[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "word-pdf-mcp"
version = "0.1.0"
description = "Local Windows MCP for serialized, native Microsoft Word PDF export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "anyio>=4.6,<5",
  "psutil>=6,<8",
  "pypdf>=5,<7",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
word-pdf-mcp = "word_pdf_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/word_pdf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["word: requires Windows and an installed desktop Microsoft Word"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
